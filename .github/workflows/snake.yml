name: Generate Abyssal Contribution Snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#DC143C&color_dots=#050505,#1A1A1A,#8B0000,#B7410E,#DC143C
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#A9A9A9&color_dots=#050505,#1A1A1A,#8B0000,#B8860B,#E8E1D5

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
