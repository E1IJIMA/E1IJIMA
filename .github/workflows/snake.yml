name: Generate Contribution Snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate pink contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23FF69B4&color_dots=%23FFF0F7%2C%23FFC0CB%2C%23FFB6C1%2C%23DDA0DD%2C%23C58BCB
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23FF69B4&color_dots=%23FFE6F2%2C%23FFB6C1%2C%23FF69B4%2C%23DA70D6%2C%23FFFFFF

      - name: Commit generated snake assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/github-snake.svg dist/github-snake-dark.svg
          git diff --cached --quiet || git commit -m "chore: update contribution snake"
          git push
