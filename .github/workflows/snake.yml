name: Generate Dark Contribution Snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: E1IJIMA
          outputs: |
            dist/github-snake.svg?color_snake=%23C46A86&color_dots=%231B1115%2C%232A1820%2C%235A1833%2C%238E4058%2C%23E05B74
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23E05B74&color_dots=%23110C0F%2C%232A1820%2C%235A1833%2C%23C46A86%2C%23F3E9EC

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/github-snake.svg dist/github-snake-dark.svg
          git diff --cached --quiet || git commit -m "chore: update dark contribution snake"
          git push
