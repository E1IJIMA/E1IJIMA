name: Build Anime Showcase GIF

on:
  push:
    paths:
      - 'anime/anime-girl-1.png'
      - 'anime/anime-girl-2.png'
      - 'anime/anime-girl-3.png'
      - 'anime/anime-girl-4.png'
      - 'scripts/create_anime_gif.py'
      - '.github/workflows/anime-gif.yml'
  workflow_dispatch:

concurrency:
  group: profile-assets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Pillow
        run: python -m pip install --upgrade Pillow

      - name: Build GIF
        run: python scripts/create_anime_gif.py

      - name: Commit generated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/anime-showcase.gif
          if git diff --cached --quiet; then
            echo "GIF is already up to date."
            exit 0
          fi
          git commit -m "chore: generate anime showcase gif"
          git pull --rebase origin main
          git push
