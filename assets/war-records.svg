<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
<title id="t">EIJIMA War Records</title><desc id="d">Dark fantasy statistics panel with animated scanline and ember effects.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#050505"/><stop offset=".65" stop-color="#0d0d0d"/><stop offset="1" stop-color="#1a0505"/></linearGradient>
  <linearGradient id="edge"><stop stop-color="#8b0000"/><stop offset=".5" stop-color="#dc143c"/><stop offset="1" stop-color="#8b0000"/></linearGradient>
  <filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="360" rx="18" fill="url(#bg)" stroke="#2b2b2b" stroke-width="2"/>
<rect x="16" y="16" width="1168" height="328" rx="14" fill="none" stroke="#8b0000" stroke-opacity=".7"/>
<g font-family="monospace" fill="#e8e1d5">
<text x="52" y="62" font-size="20" letter-spacing="5">WAR RECORDS</text>
<text x="52" y="92" font-size="12" fill="#696969" letter-spacing="3">FALLEN DIGITAL REALM • GUILD ARCHIVE</text>
<g text-anchor="middle">
<text x="180" y="155" font-size="48" font-weight="700">69</text><text x="180" y="184" font-size="12" fill="#a9a9a9">TOTAL CONTRIBUTIONS</text>
<text x="600" y="155" font-size="48" font-weight="700" fill="#dc143c" filter="url(#g)">1</text><text x="600" y="184" font-size="12" fill="#a9a9a9">CURRENT STREAK</text>
<text x="1020" y="155" font-size="48" font-weight="700">1</text><text x="1020" y="184" font-size="12" fill="#a9a9a9">LONGEST STREAK</text>
</g>
<g fill="#696969" font-size="11"><text x="180" y="218" text-anchor="middle">SINCE 2021</text><text x="600" y="218" text-anchor="middle">KEEP THE FIRE ALIVE</text><text x="1020" y="218" text-anchor="middle">FIRST MARK</text></g>
</g>
<g stroke="#1a1a1a" stroke-width="12" stroke-linecap="round"><path d="M90 276H1110"/></g>
<path d="M90 276H1110" stroke="url(#edge)" stroke-width="4" stroke-linecap="round" stroke-dasharray="160 920"><animate attributeName="stroke-dashoffset" values="1080;0" dur="3s" repeatCount="indefinite"/></path>
<g fill="#dc143c"><circle cx="120" cy="315" r="3"><animate attributeName="cy" values="315;260;315" dur="2.7s" repeatCount="indefinite"/></circle><circle cx="1060" cy="315" r="2"><animate attributeName="cy" values="315;250;315" dur="3.6s" repeatCount="indefinite"/></circle></g>
</svg>
