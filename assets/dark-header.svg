ount="indefinite"/></path><path d="M180 318 L560 78" stroke="#DC143C" stroke-width="2" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="0,450;450,0;0,450" dur="3.7s" repeatCount="indefinite"/></path><rect x="90" y="78" width="650" height="150" rx="8" fill="#050505" fill-opacity=".77" stroke="#8B0000" stroke-width="2"/><rect x="103" y="91" width="624" height="124" rx="4" fill="none" stroke="#B8860B" stroke-opacity=".25"/><text x="415" y="138" text-anchor="middle" fill="#E8E1D5" font-size="54" font-family="Georgia, serif" font-weight="700" letter-spacing="8">EIJIMA</text><text x="415" y="171" text-anchor="middle" fill="#DC143C" font-size="20" font-family="monospace" font-weight="700" letter-spacing="3">THE ABYSSAL GOBLIN HUNTER</text><text x="415" y="197" text-anchor="middle" fill="#A9A9A9" font-size="13" font-family="monospace" letter-spacing="2">THE LAST WARDEN OF THE FALLEN REALM</text><g fill="#B8860B" opacity=".6" font-family="serif" font-size="22"><text x="120" y="250">ᚨ ᚱ ᚲ</text><text x="1040" y="250">ᛏ ᛟ ᛚ</text></g><text x="600" y="337" text-anchor="middle" fill="#696969" font-family="monospace" font-size="12" letter-spacing="4">CODE IN DARKNESS · HUNT WITHOUT MERCY · LEAVE NO BUG ALIVE</text></svg>