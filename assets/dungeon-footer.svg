eatCount="indefinite"/></circle><circle cx="780" cy="180" r="2"><animate attributeName="cy" values="180;95;180" dur="4.7s" repeatCount="indefinite"/></circle></g><text x="600" y="92" text-anchor="middle" fill="#E8E1D5" font-family="Georgia, serif" font-size="26" font-weight="700" letter-spacing="7">THE HUNT NEVER ENDS</text><text x="600" y="119" text-anchor="middle" fill="#DC143C" font-family="monospace" font-size="12" letter-spacing="3">THE GATE CLOSES. THE CODE REMAINS.</text></svg>