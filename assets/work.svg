<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="E1IJIMA selected work card with floating hearts">
<defs>
  <linearGradient id="g" x1="0" x2="1"><stop stop-color="#ff71ad"/><stop offset="1" stop-color="#b99af0"/></linearGradient>
  <filter id="heartGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="1" y="1" width="898" height="298" rx="26" fill="#241326" stroke="#b985a8" stroke-opacity="0.55" stroke-width="2"/>
<rect x="24" y="24" width="270" height="252" rx="22" fill="#32172f" stroke="#e5accb" stroke-opacity="0.42" stroke-width="2"/>
<circle cx="159" cy="108" r="58" fill="#4a2350"><animate attributeName="r" values="58;64;58" dur="3.8s" repeatCount="indefinite"/></circle>
<circle cx="159" cy="108" r="42" fill="#2b1329" stroke="#ff9ac4" stroke-opacity="0.65" stroke-width="3"><animate attributeName="r" values="42;46;42" dur="3.8s" repeatCount="indefinite"/></circle>
<path d="M136 108h46M159 85v46" stroke="url(#g)" stroke-width="5" stroke-linecap="round"/>
<!-- Floating animated hearts around the plus icon -->
<g fill="#ff8fbe" filter="url(#heartGlow)" font-family="Georgia, serif" font-weight="700">
  <text x="85" y="96" font-size="19">♡<animateTransform attributeName="transform" type="translate" values="0 18; 6 0; -3 -18; 0 18" dur="4.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.5;0.2" dur="4.6s" repeatCount="indefinite"/></text>
  <text x="230" y="78" font-size="22">♡<animateTransform attributeName="transform" type="translate" values="0 28; -7 8; 5 -20; 0 28" dur="5.2s" begin=".7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;1;0.5;0.15" dur="5.2s" begin=".7s" repeatCount="indefinite"/></text>
  <text x="73" y="177" font-size="15">♥<animateTransform attributeName="transform" type="translate" values="0 10; -8 0; 5 -12; 0 10" dur="3.9s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.85;0.3;0.1" dur="3.9s" begin="1.1s" repeatCount="indefinite"/></text>
  <text x="236" y="190" font-size="17">♡<animateTransform attributeName="transform" type="translate" values="0 16; 7 3; -4 -15; 0 16" dur="4.3s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.9;0.35;0.1" dur="4.3s" begin="1.8s" repeatCount="indefinite"/></text>
</g>
<text x="55" y="228" fill="#f1c5d9" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="800">EIJIMAV1</text>
<text x="55" y="251" fill="#c8adbf" font-family="Inter,Segoe UI,sans-serif" font-size="13">current playground ♡</text>
<g transform="translate(330 50)">
  <text x="0" y="0" fill="#efbed7" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="800">♡ SELECTED WORK</text>
  <text x="0" y="45" fill="#fff5fa" font-family="Inter,Segoe UI,sans-serif" font-size="27" font-weight="800">EIJIMAV1</text>
  <text x="0" y="75" fill="#ceb8ca" font-family="Inter,Segoe UI,sans-serif" font-size="15">A small playground for experiments, utilities, and polished ideas.</text>
  <rect x="0" y="105" width="500" height="22" rx="11" fill="#4a2945"/>
  <rect x="0" y="105" width="415" height="22" rx="11" fill="url(#g)"><animate attributeName="width" values="415;470;415" dur="4s" repeatCount="indefinite"/></rect>
  <text x="518" y="121" fill="#e3a9c8" font-family="ui-monospace,monospace" font-size="13">83%</text>
  <text x="0" y="165" fill="#ff91bd" font-family="ui-monospace,monospace" font-size="14">01</text>
  <text x="36" y="165" fill="#d8c3d0" font-family="ui-monospace,monospace" font-size="14">idea → prototype → polish</text>
  <text x="0" y="194" fill="#ff91bd" font-family="ui-monospace,monospace" font-size="14">02</text>
  <text x="36" y="194" fill="#d8c3d0" font-family="ui-monospace,monospace" font-size="14">small details, big smiles ♡</text>
  <text x="0" y="223" fill="#ff91bd" font-family="ui-monospace,monospace" font-size="14">03</text>
  <text x="36" y="223" fill="#d8c3d0" font-family="ui-monospace,monospace" font-size="14">always a work in progress...</text>
