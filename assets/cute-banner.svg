 <text x="0" y="78" fill="#4f2440" font-family="Inter,Segoe UI,sans-serif" font-size="58" font-weight="800">Hello, I'm E1IJIMA ♡</text>
 <text x="3" y="122" fill="#7a4a63" font-family="Inter,Segoe UI,sans-serif" font-size="22">coding • creating • learning • making things prettier</text>
