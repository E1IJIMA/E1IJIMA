<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-label="E1IJIMA cute pink developer banner">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0f7"/><stop offset=".45" stop-color="#ffd8ea"/><stop offset="1" stop-color="#f4d6ff"/></linearGradient>
 <linearGradient id="pink" x1="0" x2="1"><stop stop-color="#ff6fae"/><stop offset=".55" stop-color="#ff8fc0"/><stop offset="1" stop-color="#c58cff"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.6" fill="#fff" opacity=".3"/></pattern>
 <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#b64c86" flood-opacity=".2"/></filter>
</defs>
<rect width="1400" height="430" rx="32" fill="url(#bg)"/>
