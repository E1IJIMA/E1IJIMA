 <text x="0" y="105" fill="#fff8fc" font-family="Georgia,serif" font-size="72" font-weight="700">E1IJIMA ♡</text>
 <text x="4" y="151" fill="#ffeaf3" font-family="Georgia,serif" font-size="23" font-style="italic">cute code • soft anime • tiny pieces of magic</text>
 <g filter="url(#shadow)"><rect x="0" y="190" width="680" height="225" rx="30" fill="url(#panel)" stroke="#fff" stroke-opacity=".28"/>
  <text x="28" y="228" fill="#fff2f8" font-family="ui-monospace,monospace" font-size="15">$ profile --mood</text>
  <text x="28" y="264" fill="#fff" font-family="ui-monospace,monospace" font-size="18">&gt; soft • creative • curious</text>
  <text x="28" y="300" fill="#fff" font-family="ui-monospace,monospace" font-size="18">&gt; web • UI • automation • AI</text>
  <text x="28" y="336" fill="#fff" font-family="ui-monospace,monospace" font-size="18">&gt; pink energy, cozy interfaces, big dreams</text>
  <rect x="28" y="370" width="590" height="5" rx="3" fill="#ffd1e5"><animate attributeName="width" values="80;580;250;80" dur="4.8s" repeatCount="indefinite"/></rect>
  <text x="28" y="398" fill="#ffe8f2" font-family="Georgia,serif" font-size="17" font-style="italic">same girl · different dreams · prettier code ♡</text></g>
</g>
<g filter="url(#shadow)">
 <rect x="900" y="55" width="410" height="490" rx="34" fill="#ffe7f1" stroke="#fff" stroke-width="4" stroke-opacity=".85"/>
 <g clip-path="url(#char)"><image href="https://raw.githubusercontent.com/E1IJIMA/E1IJIMA/main/assets/anime-girl-1.png" x="875" y="40" width="460" height="530" preserveAspectRatio="xMidYMid slice"/></g>
 <rect x="900" y="55" width="410" height="490" rx="34" fill="none" stroke="#fff" stroke-width="4" stroke-opacity=".55"/>
 <circle cx="1220" cy="95" r="7" fill="#fff"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle>
 <circle cx="1260" cy="130" r="5" fill="#ffd3e6"><animate attributeName="opacity" values="1;.25;1" dur="2.2s" repeatCount="indefinite"/></circle>
</g>
<g fill="#fff5fb" font-family="sans-serif" font-weight="700">
 <text x="710" y="96" font-size="34"><animate attributeName="y" values="96;72;96" dur="3.1s" repeatCount="indefinite"/>♡</text>
 <text x="850" y="555" font-size="30"><animate attributeName="y" values="555;530;555" dur="4.4s" repeatCount="indefinite"/>✦</text>
