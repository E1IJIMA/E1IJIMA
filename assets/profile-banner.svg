<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-label="E1IJIMA pink anime developer banner">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#241021"/><stop offset=".42" stop-color="#7a2f5b"/><stop offset=".72" stop-color="#d66ba8"/><stop offset="1" stop-color="#ffd9ea"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#ff8fc1" stop-opacity="0"/></radialGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity=".07"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#190815" flood-opacity=".42"/></filter>
 <clipPath id="char"><rect x="900" y="55" width="410" height="490" rx="34"/></clipPath>
</defs>
<rect width="1400" height="600" rx="42" fill="url(#bg)"/>
<rect width="1400" height="600" rx="42" fill="url(#glow)" opacity=".25"/>
<circle cx="1110" cy="150" r="270" fill="url(#glow)" opacity=".42"><animate attributeName="r" values="230;300;230" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="260" cy="470" r="150" fill="url(#glow)" opacity=".18"><animate attributeName="r" values="130;180;130" dur="6s" repeatCount="indefinite"/></circle>
<path d="M0 500 C190 420 340 565 530 475 C720 385 850 530 1030 445 C1190 370 1300 450 1400 410 V600 H0Z" fill="#fff" opacity=".1"/>
<g transform="translate(72 62)">
