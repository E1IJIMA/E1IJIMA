<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-label="E1IJIMA pink anime developer banner">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#321326"/><stop offset=".48" stop-color="#a84b83"/><stop offset="1" stop-color="#ffd7e8"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#ff8fc1" stop-opacity="0"/></radialGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".24"/><stop offset="1" stop-color="#fff" stop-opacity=".08"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#190815" flood-opacity=".38"/></filter>
  <clipPath id="char"><rect x="900" y="55" width="410" height="490" rx="34"/></clipPath>
</defs>
<rect width="1400" height="600" rx="42" fill="url(#bg)"/>
<rect width="1400" height="600" rx="42" fill="url(#glow)" opacity=".45"/>
<circle cx="1090" cy="150" r="260" fill="url(#glow)" opacity=".45"><animate attributeName="r" values="230;285;230" dur="7s" repeatCount="indefinite"/></circle>
<path d="M0 490 C180 410 330 555 520 465 C700 380 850 515 1030 430 C1180 360 1300 430 1400 390 V600 H0Z" fill="#fff" opacity=".1"/>
<g transform="translate(74 64)">
  <text x="0" y="20" fill="#ffd9eb" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="800" letter-spacing="5">E1IJIMA / PINK ANIME DEVELOPER</text>
  <text x="0" y="104" fill="#fff8fc" font-family="Georgia,serif" font-size="72" font-weight="700">E1IJIMA ♡</text>
  <text x="4" y="150" fill="#ffeaf3" font-family="Georgia,serif" font-size="23" font-style="italic">cute code • soft anime • tiny pieces of magic</text>
  <g filter="url(#shadow)">
    <rect x="0" y="190" width="650" height="225" rx="30" fill="url(#panel)" stroke="#fff" stroke-opacity=".28"/>
    <text x="28" y="228" fill="#fff2f8" font-family="ui-monospace,monospace" font-size="15">$ profile --mood</text>
    <text x="28" y="264" fill="#fff" font-family="ui-monospace,monospace" font-size="18">&gt; soft • creative • curious</text>
    <text x="28" y="300" fill="#fff" font-family="ui-monospace,monospace" font-size="18">&gt; web • UI • automation • AI</text>
    <text x="28" y="336" fill="#fff" font-family="ui-monospace,monospace" font-size="18">&gt; pink energy, cozy interfaces, big dreams</text>
    <rect x="28" y="370" width="560" height="5" rx="3" fill="#ffd1e5"><animate attributeName="width" values="70;550;220;70" dur="4.8s" repeatCount="indefinite"/></rect>
    <text x="28" y="398" fill="#ffe8f2" font-family="Georgia,serif" font-size="17" font-style="italic">same girl · different dreams · prettier code ♡</text>
  </g>
</g>
<g filter="url(#shadow)">
  <rect x="900" y="55" width="410" height="490" rx="34" fill="#ffe5f0" stroke="#fff" stroke-width="4" stroke-opacity=".8"/>
  <g clip-path="url(#char)">
    <image href="anime-girl-1.png" x="875" y="40" width="460" height="530" preserveAspectRatio="xMidYMid slice"/>
    <rect x="900" y="55" width="410" height="490" fill="#ff80b6" opacity=".06"/>
  </g>
  <rect x="900" y="55" width="410" height="490" rx="34" fill="none" stroke="#fff" stroke-width="4" stroke-opacity=".55"/>
</g>
<g fill="#fff5fb" font-family="sans-serif" font-weight="700">
  <text x="700" y="95" font-size="34"><animate attributeName="y" values="95;72;95" dur="3.1s" repeatCount="indefinite"/>♡</text>
  <text x="820" y="555" font-size="30"><animate attributeName="y" values="555;530;555" dur="4.4s" repeatCount="indefinite"/>✦</text>
  <text x="1330" y="120" font-size="28"><animate attributeName="y" values="120;95;120" dur="3.8s" repeatCount="indefinite"/>♡</text>
  <text x="1345" y="555" font-size="28"><animate attributeName="y" values="555;530;555" dur="4.1s" repeatCount="indefinite"/>✧</text>
</g>
<g transform="translate(780 170)"><g><circle cx="0" cy="-16" r="15" fill="#fff"/><circle cx="15" cy="-5" r="15" fill="#fff"/><circle cx="9" cy="13" r="15" fill="#fff"/><circle cx="-9" cy="13" r="15" fill="#fff"/><circle cx="-15" cy="-5" r="15" fill="#fff"/><circle cx="0" cy="0" r="8" fill="#ffc3df"/><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="9s" repeatCount="indefinite"/></g></g>
<text x="1352" y="310" fill="#ffeaf3" opacity=".82" font-family="ui-monospace,monospace" font-size="12" writing-mode="tb" letter-spacing="4">かわいいをコードに ♡</text>
</svg>