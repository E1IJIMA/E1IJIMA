 <text x="1348" y="565" font-size="28"><animate attributeName="y" values="565;540;565" dur="4.1s" repeatCount="indefinite"/>✧</text>
</g>
<g transform="translate(805 170)"><g><circle cx="0" cy="-16" r="15" fill="#fff"/><circle cx="15" cy="-5" r="15" fill="#fff"/><circle cx="9" cy="13" r="15" fill="#fff"/><circle cx="-9" cy="13" r="15" fill="#fff"/><circle cx="-15" cy="-5" r="15" fill="#fff"/><circle cx="0" cy="0" r="8" fill="#ffc3df"/><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="9s" repeatCount="indefinite"/></g></g>
