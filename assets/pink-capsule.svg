<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" role="img" aria-label="Animated pink developer identity panel">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8fc"/><stop offset=".35" stop-color="#ffd1e6"/><stop offset=".7" stop-color="#f5c4ff"/><stop offset="1" stop-color="#d9c8ff"/></linearGradient>
  <linearGradient id="shine" x1="0" x2="1"><stop stop-color="#ffffff" stop-opacity=".05"/><stop offset=".45" stop-color="#ffffff" stop-opacity=".8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".05"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#c84d8c" flood-opacity=".2"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="14" y="14" width="1172" height="192" rx="48" fill="url(#bg)" stroke="#ffffff" stroke-width="5" filter="url(#shadow)"/>
<path d="M35 55 Q240 18 430 58 T820 54 T1165 58" fill="none" stroke="url(#shine)" stroke-width="10" opacity=".9"><animate attributeName="d" dur="6s" repeatCount="indefinite" values="M35 55 Q240 18 430 58 T820 54 T1165 58;M35 62 Q240 88 430 50 T820 72 T1165 50;M35 55 Q240 18 430 58 T820 54 T1165 58"/></path>
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
  <text x="600" y="72" fill="#8c3e68" font-size="15" font-weight="800" letter-spacing="4">✦ P I N K   D E V E L O P E R   I D E N T I T Y ✦</text>
  <text x="600" y="116" fill="#6b3154" font-family="Georgia,serif" font-size="30" font-weight="700">soft code • sparkles • cute ideas • big dreams ♡</text>
  <text x="600" y="150" fill="#8f6681" font-size="14">CREATIVE MODE   ·   BUILDER MODE   ·   SOCIAL MODE   ·   DISCORD MODE 🎧</text>
</g>
<g filter="url(#glow)" fill="#fff">
  <text x="70" y="78" font-size="30"><animate attributeName="y" values="78;58;78" dur="3s" repeatCount="indefinite"/>✦</text>
  <text x="1128" y="92" font-size="24"><animate attributeName="y" values="92;66;92" dur="3.8s" repeatCount="indefinite"/>♡</text>
  <text x="98" y="166" font-size="20"><animate attributeName="opacity" values=".25;1;.25" dur="2.1s" repeatCount="indefinite"/>✧</text>
  <text x="1088" y="170" font-size="20"><animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/>✦</text>
</g>
<circle cx="250" cy="182" r="12" fill="#ff7eb6"><animate attributeName="cy" values="182;170;182" dur="2.6s" repeatCount="indefinite"/></circle>
<circle cx="600" cy="182" r="12" fill="#d08ff0"><animate attributeName="cy" values="182;194;182" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="950" cy="182" r="12" fill="#ffb7d8"><animate attributeName="cy" values="182;168;182" dur="2.8s" repeatCount="indefinite"/></circle>
</svg>
