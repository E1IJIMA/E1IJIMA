<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc"><title id="title">The Hunt Never Ends</title><desc id="desc">Animated dungeon gate footer in black and crimson.</desc><defs><linearGradient id="g"><stop stop-color="#050505"/><stop offset=".5" stop-color="#8B0000"/><stop offset="1" stop-color="#050505"/></linearGradient><filter id="b"><feGaussianBlur stdDeviation="5" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="190" fill="#050505"/><path d="M0 150Q300 80 600 150T1200 150" fill="none" stroke="url(#g)" stroke-width="28" opacity=".45"><animate attributeName="d" values="M0 150Q300 80 600 150T1200 150;M0 150Q300 125 600 150T1200 150;M0 150Q300 80 600 150T1200 150" dur="7s" repeatCount="indefinite"/></path><g stroke="#1A1A1A" stroke-width="5" fill="#0D0D0D"><path d="M390 175V80q0-58 210-58t210 58v95"/><path d="M425 175V92q0-35 175-35t175 35v83"/></g><path d="M600 57v118M425 95h350" stroke="#8B0000" stroke-width="3"/><text x="600" y="126" text-anchor="middle" fill="#E8E1D5" font-family="Georgia,serif" font-size="30" font-weight="700" letter-spacing="8" filter="url(#b)">THE HUNT NEVER ENDS</text><text x="600" y="153" text-anchor="middle" fill="#A9A9A9" font-family="monospace" font-size="10" letter-spacing="4">THE GATE CLOSES • THE CODE REMAINS</text><g fill="#DC143C"><circle cx="300" cy="160" r="2"><animate attributeName="cy" values="160;75;160" dur="4s" repeatCount="indefinite"/></circle><circle cx="880" cy="165" r="2"><animate attributeName="cy" values="165;85;165" dur="5s" repeatCount="indefinite"/></circle></g></svg>
