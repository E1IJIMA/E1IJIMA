<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">Pink Rhythm mini game</title>
<desc id="desc">A clean pink rhythm game with four note lanes, animated falling notes, a combo meter, and a cute mascot.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#fffafd"/><stop offset="100%" stop-color="#ffeaf4"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#fff6fa"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect x="6" y="6" width="888" height="268" rx="24" fill="url(#bg)" stroke="#f2afcb" stroke-width="2"/>
<text x="28" y="36" font-family="ui-rounded,system-ui,sans-serif" font-size="21" font-weight="900" fill="#c84f88">🎵 Pink Rhythm</text>
<text x="184" y="36" font-family="ui-rounded,system-ui,sans-serif" font-size="12" font-weight="700" fill="#a66a86">hit the beat • follow the notes • keep the combo ✦</text>

<rect x="20" y="54" width="560" height="206" rx="20" fill="url(#panel)" stroke="#f5c5d9" stroke-width="2"/>
<rect x="598" y="54" width="282" height="206" rx="20" fill="#fff" stroke="#f5c5d9" stroke-width="2"/>

<g font-family="ui-rounded,system-ui,sans-serif" font-size="10" font-weight="800" fill="#c56a91">
  <text x="145" y="72">A</text><text x="257" y="72">S</text><text x="369" y="72">D</text><text x="481" y="72">F</text>
</g>
<rect x="126" y="80" width="80" height="138" rx="14" fill="#fff8fb" stroke="#f4bfd6"/>
<rect x="133" y="87" width="66" height="124" rx="11" fill="#fff0f6" opacity=".65"/>
<rect x="134" y="195" width="64" height="16" rx="8" fill="#ffd9e8"/>
<g>
  <rect x="146" y="-12" width="40" height="16" rx="8" fill="#ff6fae" opacity=".95">
    <animate attributeName="y" values="-12;205" dur="2.5s" begin="-0s" repeatCount="indefinite"/>
  </rect>
  <circle cx="166" cy="-4" r="4" fill="#fff" opacity=".7">
    <animate attributeName="cy" values="-4;213" dur="2.5s" begin="-0s" repeatCount="indefinite"/>
  </circle>
</g><rect x="238" y="80" width="80" height="138" rx="14" fill="#fff8fb" stroke="#f4bfd6"/>
<rect x="245" y="87" width="66" height="124" rx="11" fill="#fff0f6" opacity=".65"/>
<rect x="246" y="195" width="64" height="16" rx="8" fill="#ffd9e8"/>
<g>
  <rect x="258" y="-12" width="40" height="16" rx="8" fill="#ff8fba" opacity=".95">
    <animate attributeName="y" values="-12;205" dur="2.85s" begin="-0.55s" repeatCount="indefinite"/>
  </rect>
  <circle cx="278" cy="-4" r="4" fill="#fff" opacity=".7">
    <animate attributeName="cy" values="-4;213" dur="2.85s" begin="-0.55s" repeatCount="indefinite"/>
  </circle>
</g><rect x="350" y="80" width="80" height="138" rx="14" fill="#fff8fb" stroke="#f4bfd6"/>
<rect x="357" y="87" width="66" height="124" rx="11" fill="#fff0f6" opacity=".65"/>
<rect x="358" y="195" width="64" height="16" rx="8" fill="#ffd9e8"/>
<g>
  <rect x="370" y="-12" width="40" height="16" rx="8" fill="#ef72aa" opacity=".95">
    <animate attributeName="y" values="-12;205" dur="3.2s" begin="-1.1s" repeatCount="indefinite"/>
  </rect>
  <circle cx="390" cy="-4" r="4" fill="#fff" opacity=".7">
    <animate attributeName="cy" values="-4;213" dur="3.2s" begin="-1.1s" repeatCount="indefinite"/>
  </circle>
</g><rect x="462" y="80" width="80" height="138" rx="14" fill="#fff8fb" stroke="#f4bfd6"/>
<rect x="469" y="87" width="66" height="124" rx="11" fill="#fff0f6" opacity=".65"/>
<rect x="470" y="195" width="64" height="16" rx="8" fill="#ffd9e8"/>
<g>
  <rect x="482" y="-12" width="40" height="16" rx="8" fill="#f5a0c2" opacity=".95">
    <animate attributeName="y" values="-12;205" dur="3.55s" begin="-1.6500000000000001s" repeatCount="indefinite"/>
  </rect>
  <circle cx="502" cy="-4" r="4" fill="#fff" opacity=".7">
    <animate attributeName="cy" values="-4;213" dur="3.55s" begin="-1.6500000000000001s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- hit line -->
<g>
  <rect x="102" y="216" width="484" height="4" rx="2" fill="#ff8fba" opacity=".9"/>
  <rect x="188" y="212" width="56" height="12" rx="6" fill="#fff" stroke="#ff8fba"/>
  <rect x="300" y="212" width="56" height="12" rx="6" fill="#fff" stroke="#ff8fba"/>
  <rect x="412" y="212" width="56" height="12" rx="6" fill="#fff" stroke="#ff8fba"/>
  <rect x="524" y="212" width="56" height="12" rx="6" fill="#fff" stroke="#ff8fba"/>
</g>

<!-- mascot -->
<g transform="translate(50 188)">
  <circle cx="28" cy="30" r="24" fill="#fff" stroke="#eda0c0" stroke-width="2"/>
  <path d="M10 11 Q6-3 15 0 L26 12" fill="#fff" stroke="#eda0c0" stroke-width="2"/>
  <path d="M46 11 Q50-3 41 0 L30 12" fill="#fff" stroke="#eda0c0" stroke-width="2"/>
  <circle cx="20" cy="28" r="2.7" fill="#9d617b"/><circle cx="36" cy="28" r="2.7" fill="#9d617b"/>
  <path d="M25 35 Q28 39 31 35" fill="none" stroke="#d26a93" stroke-width="2" stroke-linecap="round"/>
  <path d="M4 10 Q28-4 52 10" fill="none" stroke="#ff8fba" stroke-width="3" stroke-linecap="round" opacity=".8"/>
</g>

<!-- hud -->
<text x="620" y="82" font-family="ui-rounded,system-ui,sans-serif" font-size="13" font-weight="900" fill="#a85b7d">RHYTHM BOARD</text>
<text x="620" y="112" font-family="ui-rounded,system-ui,sans-serif" font-size="28" font-weight="900" fill="#dd5f98">♡ 98.6%</text>
<text x="620" y="130" font-family="ui-rounded,system-ui,sans-serif" font-size="11" fill="#ad7690">ACCURACY</text>
<line x1="620" y1="145" x2="858" y2="145" stroke="#f1d4e1"/>
<text x="620" y="167" font-family="ui-rounded,system-ui,sans-serif" font-size="11" font-weight="800" fill="#ad7690">COMBO</text>
<text x="620" y="191" font-family="ui-rounded,system-ui,sans-serif" font-size="22" font-weight="900" fill="#ef72aa">x 24</text>
<text x="730" y="167" font-family="ui-rounded,system-ui,sans-serif" font-size="11" font-weight="800" fill="#ad7690">SCORE</text>
<text x="730" y="191" font-family="ui-rounded,system-ui,sans-serif" font-size="22" font-weight="900" fill="#d75e96">7,420</text>
<rect x="620" y="211" width="238" height="17" rx="9" fill="#fff0f6"/>
<rect x="620" y="211" width="202" height="17" rx="9" fill="#ff9fc4">
  <animate attributeName="width" values="160;215;190;202" dur="4.2s" repeatCount="indefinite"/>
</rect>
<text x="630" y="223" font-family="ui-rounded,system-ui,sans-serif" font-size="9" font-weight="900" fill="#fff">PERFECT STREAK</text>
<g fill="#fff" stroke="#ff6fae" stroke-width="1.4" filter="url(#glow)">
  <path d="M842 96 l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"><animate attributeName="opacity" values=".25;1;.25" dur="2s" repeatCount="indefinite"/></path>
  <path d="M846 232 l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" begin="-.8s" repeatCount="indefinite"/></path>
</g>
</svg>