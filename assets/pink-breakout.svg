<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">Pink Breakout mini game</title>
<desc id="desc">A polished pink arcade breakout game with bricks, paddle, animated ball, combo and score.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#fffafd"/>
    <stop offset="100%" stop-color="#ffeaf4"/>
  </linearGradient>
  <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#fff8fb"/>
    <stop offset="100%" stop-color="#fff0f6"/>
  </linearGradient>
  <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ff7db0"/>
    <stop offset="100%" stop-color="#e95696"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".12"/>
  </filter>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect x="6" y="6" width="888" height="288" rx="26" fill="url(#bg)" stroke="#f1adc9" stroke-width="2"/>

<!-- Header -->
<g font-family="ui-rounded,system-ui,-apple-system,Segoe UI,sans-serif">
  <text x="28" y="38" font-size="21" font-weight="900" fill="#c84e88">PINK BREAKOUT</text>
  <text x="240" y="38" font-size="12" font-weight="700" fill="#a76a86">bounce • break • combo ✦</text>
</g>

<!-- Main unified arcade surface -->
<rect x="22" y="56" width="856" height="222" rx="22" fill="#fff" stroke="#f4c2d7" filter="url(#shadow)"/>

<!-- Game field -->
<rect x="38" y="72" width="586" height="190" rx="17" fill="url(#field)"/>
<g opacity=".55" stroke="#f8dce8" stroke-width="1">
  <path d="M54 102H608 M54 132H608 M54 162H608 M54 192H608 M54 222H608 M54 252H608"/>
  <path d="M84 86V258 M114 86V258 M144 86V258 M174 86V258 M204 86V258 M234 86V258 M264 86V258 M294 86V258 M324 86V258 M354 86V258 M384 86V258 M414 86V258 M444 86V258 M474 86V258 M504 86V258 M534 86V258 M564 86V258 M594 86V258"/>
</g>

<!-- Bricks -->
<g filter="url(#glow)">
  <g fill="#ffb5d0"><rect x="70" y="92" width="72" height="17" rx="6"/><rect x="148" y="92" width="72" height="17" rx="6"/><rect x="226" y="92" width="72" height="17" rx="6"/><rect x="304" y="92" width="72" height="17" rx="6"/><rect x="382" y="92" width="72" height="17" rx="6"/><rect x="460" y="92" width="72" height="17" rx="6"/></g>
  <g fill="#ff8fba"><rect x="70" y="115" width="72" height="17" rx="6"/><rect x="148" y="115" width="72" height="17" rx="6"/><rect x="226" y="115" width="72" height="17" rx="6"/><rect x="304" y="115" width="72" height="17" rx="6"/><rect x="382" y="115" width="72" height="17" rx="6"/><rect x="460" y="115" width="72" height="17" rx="6"/></g>
  <g fill="#ff6fae"><rect x="108" y="138" width="72" height="17" rx="6"/><rect x="186" y="138" width="72" height="17" rx="6"/><rect x="264" y="138" width="72" height="17" rx="6"/><rect x="342" y="138" width="72" height="17" rx="6"/><rect x="420" y="138" width="72" height="17" rx="6"/></g>
  <rect x="264" y="92" width="72" height="17" rx="6" fill="#e95595">
    <animate attributeName="opacity" values="1;.55;1" dur="1.5s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- Ball + trail -->
<g filter="url(#glow)">
  <path d="M520 174 Q448 146 374 178 T242 226" fill="none" stroke="#ffb5d0" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 10" opacity=".8"/>
  <circle cx="242" cy="226" r="7" fill="#fff" stroke="#e65395" stroke-width="3">
    <animate attributeName="cx" values="242;374;520;430;300;180;242" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="226;178;174;214;226;196;226" dur="4.5s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- Paddle -->
<g filter="url(#shadow)">
  <rect x="250" y="238" width="120" height="12" rx="6" fill="url(#pink)">
    <animate attributeName="x" values="248;410;300;160;248" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="272" y="240" width="76" height="3" rx="2" fill="#fff" opacity=".7">
    <animate attributeName="x" values="270;432;322;182;270" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- Sparkles -->
<g fill="#fff" stroke="#ff6fae" stroke-width="1.4" filter="url(#glow)">
  <path d="M58 86 l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></path>
  <path d="M566 170 l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"><animate attributeName="opacity" values=".25;1;.25" dur="2.4s" begin="-.6s" repeatCount="indefinite"/></path>
  <path d="M584 236 l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" begin="-1s" repeatCount="indefinite"/></path>
</g>

<!-- HUD divider -->
<line x1="646" y1="74" x2="646" y2="260" stroke="#f3d9e5" stroke-width="2"/>

<!-- HUD -->
<g font-family="ui-rounded,system-ui,-apple-system,Segoe UI,sans-serif">
  <text x="668" y="91" font-size="12" font-weight="900" fill="#a85b7d">ARCADE STATUS</text>

  <text x="668" y="122" font-size="28" font-weight="900" fill="#dc5c96">7,420</text>
  <text x="668" y="140" font-size="10" font-weight="800" fill="#ad7690">SCORE</text>

  <text x="790" y="122" font-size="22" font-weight="900" fill="#ed73aa">x24</text>
  <text x="790" y="140" font-size="10" font-weight="800" fill="#ad7690">COMBO</text>

  <line x1="668" y1="154" x2="848" y2="154" stroke="#f1d4e1"/>

  <text x="668" y="178" font-size="10" font-weight="800" fill="#ad7690">LEVEL</text>
  <text x="668" y="200" font-size="21" font-weight="900" fill="#d85e96">07</text>

  <text x="742" y="178" font-size="10" font-weight="800" fill="#ad7690">BRICKS</text>
  <text x="742" y="200" font-size="21" font-weight="900" fill="#ef72aa">23</text>

  <text x="818" y="178" font-size="10" font-weight="800" fill="#ad7690">LIVES</text>
  <text x="818" y="200" font-size="17" font-weight="900" fill="#ef72aa">♥ ♥ ♥</text>

  <rect x="668" y="216" width="180" height="16" rx="8" fill="#fff0f6"/>
  <rect x="668" y="216" width="146" height="16" rx="8" fill="#ff9fc4">
    <animate attributeName="width" values="122;164;146;138;146" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="678" y="227.5" font-size="8.5" font-weight="900" fill="#fff">PERFECT STREAK</text>

  <rect x="668" y="240" width="92" height="19" rx="9.5" fill="#fff5f9" stroke="#f4c3d8"/>
  <circle cx="682" cy="249.5" r="3.5" fill="#55c69a"><animate attributeName="opacity" values="1;.3;1" dur="1.4s" repeatCount="indefinite"/></circle>
  <text x="692" y="253" font-size="9" font-weight="800" fill="#a96783">AUTO PLAY</text>

  <text x="774" y="253" font-size="10" font-weight="800" fill="#c45b8b">READY ✦</text>
</g>
</svg>