<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-label="Animated pink sparkle divider">
<defs>
  <linearGradient id="g" x1="0" x2="1">
    <stop stop-color="#ff9dc8"/>
    <stop offset="0.5" stop-color="#ff4e9b"/>
    <stop offset="1" stop-color="#f8b7da"/>
  </linearGradient>
</defs>
<path d="M40 45 C180 8 270 82 410 45 S650 8 800 45 S1015 82 1160 45" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round" opacity="0.55">
  <animate attributeName="stroke-dasharray" values="1,18;24,18;1,18" dur="2.8s" repeatCount="indefinite"/>
</path>
<g font-family="Georgia, serif" font-weight="700">
  <text x="105" y="31" font-size="24" fill="#ff5da4">♡<animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="2.4s" repeatCount="indefinite"/></text>
  <text x="302" y="69" font-size="18" fill="#ff73b1">✦<animateTransform attributeName="transform" type="rotate" from="0 302 69" to="360 302 69" dur="5s" repeatCount="indefinite"/></text>
  <text x="595" y="32" font-size="25" fill="#ffffff">✧<animate attributeName="opacity" values="0.25;1;0.25" dur="1.9s" repeatCount="indefinite"/></text>
  <text x="840" y="70" font-size="22" fill="#ff5da4">♡<animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="2.1s" repeatCount="indefinite"/></text>
  <text x="1080" y="30" font-size="19" fill="#ff73b1">✦<animateTransform attributeName="transform" type="rotate" from="360 1080 30" to="0 1080 30" dur="4.2s" repeatCount="indefinite"/></text>
</g>
</svg>
