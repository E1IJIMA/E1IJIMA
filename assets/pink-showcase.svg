<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" role="img" aria-label="Animated pink showcase for E1IJIMA">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0f7"/><stop offset=".5" stop-color="#ffd0e5"/><stop offset="1" stop-color="#e8d3ff"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".92"/><stop offset="1" stop-color="#fff" stop-opacity=".67"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#c75b93" flood-opacity=".18"/></filter>
</defs>
<rect x="10" y="10" width="1380" height="440" rx="36" fill="url(#bg)" stroke="#fff" stroke-width="4"/>
<circle cx="1210" cy="75" r="120" fill="#fff" opacity=".23"><animate attributeName="r" values="90;135;90" dur="6s" repeatCount="indefinite"/></circle>
<circle cx="180" cy="390" r="110" fill="#fff" opacity=".20"><animate attributeName="r" values="80;125;80" dur="5s" repeatCount="indefinite"/></circle>

<g font-family="Georgia,serif" fill="#6c2d58">
  <text x="70" y="72" font-size="34" font-weight="700">🎀 little pink universe</text>
  <text x="70" y="105" font-size="17" fill="#9b5b83">a cute corner for code, ideas &amp; tiny bits of magic ♡</text>
</g>

<g filter="url(#shadow)">
  <g transform="translate(70 145)">
    <rect width="380" height="225" rx="28" fill="url(#card)" stroke="#fff" stroke-width="2"/>
    <circle cx="42" cy="42" r="20" fill="#ff78b5"/><text x="35" y="49" font-size="20" fill="#fff">♡</text>
    <text x="78" y="40" font-family="ui-monospace,monospace" font-size="14" fill="#a44879">01 / CODE</text>
    <text x="34" y="88" font-family="Georgia,serif" font-size="28" font-weight="700" fill="#6c2d58">build with heart</text>
    <text x="34" y="118" font-family="ui-monospace,monospace" font-size="14" fill="#8a6379">web · python · automation</text>
    <path d="M34 160 H330" stroke="#f6b2d1" stroke-width="6" stroke-linecap="round"/>
    <path d="M34 160 H34" stroke="#ff5fa6" stroke-width="6" stroke-linecap="round"><animate attributeName="d" values="M34 160 H40;M34 160 H330;M34 160 H180;M34 160 H40" dur="4s" repeatCount="indefinite"/></path>
    <text x="34" y="192" font-family="Georgia,serif" font-size="16" fill="#a44879">idea → create → polish → sparkle</text>
  </g>

  <g transform="translate(510 145)">
    <rect width="380" height="225" rx="28" fill="url(#card)" stroke="#fff" stroke-width="2"/>
    <circle cx="42" cy="42" r="20" fill="#cb9aff"/><text x="35" y="49" font-size="20" fill="#fff">✦</text>
    <text x="78" y="40" font-family="ui-monospace,monospace" font-size="14" fill="#8655a8">02 / VIBE</text>
    <text x="34" y="88" font-family="Georgia,serif" font-size="28" font-weight="700" fill="#6c2d58">soft little details</text>
    <text x="34" y="118" font-family="ui-monospace,monospace" font-size="14" fill="#8a6379">bows · sparkles · cozy UI</text>
    <g transform="translate(75 172)">
      <path d="M0 0 C-28-24 -50 2 -12 24 C-35 53 1 58 20 31 C39 58 75 53 52 24 C88 2 66-24 35 0 C21-29 13-29 0 0Z" fill="#ff78b5">
        <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="2.5s" repeatCount="indefinite"/>
      </path>
      <circle cx="20" cy="22" r="7" fill="#ffd1e5"/>
    </g>
    <text x="150" y="187" font-family="Georgia,serif" font-size="16" fill="#a44879">make it lovely ♡</text>
  </g>

  <g transform="translate(950 145)">
    <rect width="380" height="225" rx="28" fill="url(#card)" stroke="#fff" stroke-width="2"/>
    <circle cx="42" cy="42" r="20" fill="#ff5fa6"/><text x="35" y="49" font-size="20" fill="#fff">✧</text>
    <text x="78" y="40" font-family="ui-monospace,monospace" font-size="14" fill="#a44879">03 / MAGIC</text>
    <text x="34" y="88" font-family="Georgia,serif" font-size="28" font-weight="700" fill="#6c2d58">currently online ✨</text>
    <text x="34" y="118" font-family="ui-monospace,monospace" font-size="14" fill="#8a6379">dreaming · learning · shipping</text>
    <text x="34" y="168" font-family="ui-monospace,monospace" font-size="14" fill="#7b5b6e">status = </text>
    <text x="112" y="168" font-family="ui-monospace,monospace" font-size="14" fill="#e74f98">PINK_MODE</text>
    <circle cx="302" cy="163" r="8" fill="#ff78b5"><animate attributeName="opacity" values=".25;1;.25" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="34" y="198" font-family="Georgia,serif" font-size="16" fill="#a44879">same girl · different dreams ♡</text>
  </g>
</g>

<g fill="#fff" font-family="sans-serif" font-weight="700">
  <text x="470" y="110" font-size="28"><animate attributeName="y" values="110;90;110" dur="3.2s" repeatCount="indefinite"/>♡</text>
  <text x="895" y="95" font-size="26"><animate attributeName="y" values="95;72;95" dur="3.8s" repeatCount="indefinite"/>✦</text>
  <text x="1330" y="120" font-size="28"><animate attributeName="y" values="120;96;120" dur="4.1s" repeatCount="indefinite"/>♡</text>
  <text x="920" y="395" font-size="24"><animate attributeName="y" values="395;372;395" dur="4.6s" repeatCount="indefinite"/>✧</text>
</g>
</svg>