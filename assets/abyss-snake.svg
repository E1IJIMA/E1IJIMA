<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="t d"><title id="t">The Serpent of the Abyss</title><desc id="d">Animated crimson serpent traveling through a dark rune field.</desc><defs><linearGradient id="b"><stop stop-color="#050505"/><stop offset="1" stop-color="#160505"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="260" rx="18" fill="url(#b)" stroke="#2b2b2b"/><g opacity=".35" stroke="#8b0000" stroke-width="2"><path d="M30 65H1170M30 130H1170M30 195H1170" stroke-dasharray="8 18"/></g><text x="600" y="45" text-anchor="middle" font-family="monospace" font-size="17" letter-spacing="6" fill="#e8e1d5">THE SERPENT OF THE ABYSS</text><text x="600" y="70" text-anchor="middle" font-family="monospace" font-size="10" letter-spacing="3" fill="#696969">ANIMATED HUNTING TRACE</text><path d="M90 150 C180 80 250 220 340 150 S500 80 590 150 S750 220 840 150 S1000 80 1110 150" fill="none" stroke="#8b0000" stroke-width="22" stroke-linecap="round" opacity=".5"/><path d="M90 150 C180 80 250 220 340 150 S500 80 590 150 S750 220 840 150 S1000 80 1110 150" fill="none" stroke="#dc143c" stroke-width="9" stroke-linecap="round" stroke-dasharray="55 25" filter="url(#g)"><animate attributeName="stroke-dashoffset" values="0;-320" dur="2.2s" repeatCount="indefinite"/></path><circle cx="90" cy="150" r="10" fill="#e8e1d5"/><circle cx="90" cy="150" r="5" fill="#dc143c"><animate attributeName="cx" values="90;1110;90" dur="7s" repeatCount="indefinite"/></circle><g fill="#b7410e"><circle cx="260" cy="105" r="3"><animate attributeName="cy" values="105;80;105" dur="2s" repeatCount="indefinite"/></circle><circle cx="930" cy="195" r="2"><animate attributeName="cy" values="195;170;195" dur="2.7s" repeatCount="indefinite"/></circle></g><text x="600" y="225" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="4" fill="#a9a9a9">NO BUG SHALL SURVIVE THE TRAIL</text></svg>
