<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="Pink anime developer about me panel">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7fb"/><stop offset=".48" stop-color="#ffd7ea"/><stop offset="1" stop-color="#dec9ff"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".92"/><stop offset="1" stop-color="#fff0f8" stop-opacity=".88"/></linearGradient>
  <linearGradient id="pink" x1="0" x2="1"><stop stop-color="#ff5fa8"/><stop offset="1" stop-color="#b978e8"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#bd4d8c" flood-opacity=".22"/></filter>
